name: Testes automatizados

on:
  push:
    branches: [main, revisao-tecnica]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar cobertura
        run: python -m pip install coverage

      - name: Executar testes e cobertura
        run: python -m coverage run --source=estoque -m unittest -v

      - name: Exibir relatorio de cobertura
        run: python -m coverage report -m